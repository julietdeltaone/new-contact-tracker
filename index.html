<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>New Contacts Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0b0e14;--panel:#131826;--panel2:#1a2133;--line:#262e44;--fg:#eceff6;--muted:#939cb2;--faint:#626b84;--warn:#ffb08a;
  --l1:#3ad6b5;--l2:#6db8ee;--l3:#a595f3;--l4:#f291b4;--l5:#ff8a63;
  --glass:rgba(17,21,33,.72);--glass-brd:rgba(255,255,255,.09);
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --body:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.22,.8,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#bgfx{position:fixed;inset:-12% -6%;z-index:0;pointer-events:none;background:
  radial-gradient(560px 380px at 12% 6%,rgba(58,214,181,.13),transparent 65%),
  radial-gradient(680px 460px at 88% 0%,rgba(109,184,238,.12),transparent 65%),
  radial-gradient(760px 560px at 78% 88%,rgba(165,149,243,.11),transparent 65%),
  radial-gradient(620px 480px at 8% 92%,rgba(242,145,180,.09),transparent 65%),
  radial-gradient(500px 380px at 50% 55%,rgba(255,138,99,.06),transparent 65%);
  will-change:transform}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--l2);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);margin:0;font-weight:700;letter-spacing:-.01em}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.35);backdrop-filter:blur(16px) saturate(1.35);border:1px solid var(--glass-brd)}
@keyframes swapin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes slidein{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.9)}55%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes savedot{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.swap-in{animation:swapin .2s var(--ease)}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
/* top bar */
.topbar{position:relative;z-index:50;height:48px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;border-left:0;border-right:0;border-top:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:26px;height:26px;border-radius:8px;flex:none;background:linear-gradient(135deg,var(--l1),var(--l2) 55%,var(--l3));display:grid;place-content:center;color:#0b0e14}
.brand .mark svg{width:16px;height:16px}
.brand h1{font-size:17px;white-space:nowrap}
.ver{font:500 10.5px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;background:rgba(255,255,255,.03);flex:none}
.topbar .sp{flex:1}
.savedot{width:8px;height:8px;border-radius:50%;background:var(--l1);opacity:.35;flex:none}
.savedot.tick{opacity:1;animation:savedot .45s var(--ease)}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--fg);font-weight:500;font-size:13.5px;padding:6px 12px;border-radius:9px;cursor:pointer;transition:transform .15s var(--ease),border-color .15s;white-space:nowrap}
.btn:hover{border-color:#3d4a6e;transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.danger{color:#ff9d8a}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:8px}
.btn .k{font:500 10.5px var(--mono);color:var(--faint);margin-left:7px}
.btn.icon{padding:6px 9px}
/* shell */
#shell{position:relative;z-index:1;flex:1;display:grid;grid-template-columns:320px minmax(0,1fr) 320px;min-height:0}
@media (min-width:1700px){#shell{grid-template-columns:360px minmax(0,1fr) 360px}}
.pane{min-height:0;min-width:0;display:flex;flex-direction:column}
/* left rail */
.rail{border-top:0;border-bottom:0;border-left:0;background:rgba(15,18,28,.55)}
.railhead{padding:12px 12px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;flex:none}
.railhead .rrow{display:flex;gap:8px}
.in,.sel{background:rgba(11,14,20,.6);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:14px;min-width:0;transition:border-color .15s,box-shadow .15s}
.in:focus,.sel:focus{border-color:var(--l2);box-shadow:0 0 0 3px rgba(109,184,238,.16);outline:none}
.railhead .in{flex:1}
.railhead .sel{font-size:12.5px;padding:6px 8px}
.raillist{flex:1;overflow-y:auto;padding:6px}
.pitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:12px;padding:9px 11px;cursor:pointer;color:var(--fg);transition:background .13s,border-color .13s}
.pitem:hover{background:rgba(255,255,255,.035)}
.pitem.sel{background:rgba(109,184,238,.1);border-color:rgba(109,184,238,.35)}
.pitem .pn{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px}
.pitem .pn .dot{width:7px;height:7px;border-radius:50%;flex:none}
.pitem .pm{font:11px var(--mono);color:var(--faint);text-align:right;padding-top:3px}
.pitem .ps{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin-top:3px}
.segstrip{display:inline-flex;gap:3px}
.segstrip i{width:22px;height:5px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden;display:block}
.segstrip i u{display:block;height:100%}
.pitem .pc{font:10.5px var(--mono);color:var(--muted)}
.pitem .pl{font:11px var(--mono);color:var(--faint);margin-left:auto}
.railempty{padding:22px 14px;color:var(--muted);font-size:13.5px;text-align:center}
/* center */
.center{background:rgba(11,14,20,.25)}
.cscroll{flex:1;overflow-y:auto;padding:18px 22px 22px;min-height:0}
.cwrap{max-width:1060px;margin:0 auto}
.phead2{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.phead2 .nm{flex:1 1 220px;min-width:0;background:transparent;border:0;border-bottom:1px solid transparent;font:700 clamp(24px,3.2vw,34px) var(--display);padding:2px 0;color:var(--fg);letter-spacing:-.01em}
.phead2 .nm:focus{outline:none;border-bottom-color:var(--l2)}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.seg2 button{background:rgba(11,14,20,.5);color:var(--muted);border:0;font-size:12.5px;padding:6px 11px;cursor:pointer}
.seg2 button[aria-pressed="true"]{background:var(--panel2);color:var(--fg)}
.pmeta{font:12px var(--mono);color:var(--faint);margin-bottom:16px;display:flex;flex-wrap:wrap;gap:4px 16px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;margin-bottom:20px}
.form label{display:block;font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.form .in,.form .sel{width:100%}
.form .wide{grid-column:1/-1}
.form textarea{width:100%;min-height:64px;resize:vertical}
.linkline{font-size:12px;margin-top:5px;color:var(--muted)}
.linkline button{background:none;border:0;color:var(--l2);cursor:pointer;font-size:12px;padding:0}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:18px}
.rule{border-radius:13px;padding:11px 14px;font-size:13px;color:var(--muted)}
.rule b{display:block;color:var(--fg);font:700 13.5px var(--display)}
.layer{margin-bottom:20px}
.lh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-bottom:8px}
.lh h2{font-size:17px;display:flex;align-items:center;gap:9px}
.lh h2 i{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.lh .tag{font:11.5px var(--mono);color:var(--faint)}
.lh .cnt{margin-left:auto;font:500 12px var(--mono);color:var(--muted)}
.rows{border-radius:13px;overflow:hidden;background:rgba(19,24,38,.5);border:1px solid var(--line)}
.row{padding:11px 14px;border-top:1px solid var(--line);transition:background .3s}
.row:first-child{border-top:0}
.row.flash{background:rgba(109,184,238,.13)}
.row .t{font-weight:600;font-size:14.5px}
.row.on .t{color:var(--muted)}
.row .ask{font-size:14px;margin-top:1px}
.row.on .ask{color:var(--faint)}
.row .then{font-size:12.5px;color:var(--muted);margin-top:1px}
.row .then b{font:500 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-right:6px}
.chip{font:500 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:8px}
.row textarea.ans{width:100%;resize:none;overflow:hidden;min-height:36px;background:rgba(11,14,20,.6);border:1px solid var(--line);border-radius:9px;font-size:14px;padding:7px 10px;margin-top:7px;transition:border-color .18s,box-shadow .18s}
.row textarea.ans::placeholder{color:var(--faint)}
.row textarea.ans:focus{border-color:var(--c,var(--l2));box-shadow:0 0 0 3px rgba(109,184,238,.14);outline:none}
.row.on textarea.ans{border-color:var(--c)}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center}
.sugg span{font:9.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.sugg button{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer;transition:color .15s,border-color .15s}
.sugg button:hover{color:var(--fg);border-color:#3d4a6e}
/* capture bar */
.capture{flex:none;border-left:0;border-right:0;border-bottom:0;padding:11px 16px 12px;position:relative;z-index:5}
.capture .cq{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.capture .cq .lab{font:500 9.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;flex:none}
.capture .cq .qt{font-weight:600;font-size:14.5px}
.capture .cq .qa{color:var(--muted);font-size:13.5px}
.capture .crow{display:flex;gap:8px;margin-top:8px}
.capture input{flex:1}
.capture .cprog{display:flex;gap:14px;align-items:center;margin-top:7px;font:10.5px var(--mono);color:var(--faint);flex-wrap:wrap}
.capture .cprog button{background:none;border:0;color:var(--muted);cursor:pointer;font:500 10.5px var(--mono);padding:0;text-decoration:underline}
.capture .cprog button:hover{color:var(--fg)}
.capture .pbar{height:4px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:8px;overflow:hidden}
.capture .pbar u{display:block;height:100%;background:linear-gradient(90deg,var(--l1),var(--l2));transition:width .35s var(--ease)}
/* context rail */
.context{border-top:0;border-bottom:0;border-right:0;background:rgba(15,18,28,.55)}
.ctxscroll{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px;min-height:0}
.card{border-radius:15px;padding:15px;background:rgba(19,24,38,.55);border:1px solid var(--line)}
.card h3{font-size:15px;margin-bottom:8px}
svg.ring{display:block;width:100%;height:auto;max-width:290px;margin:0 auto}
.seg{stroke:rgba(11,14,20,.65);stroke-width:1;cursor:pointer;transition:opacity .18s}
.seg:hover{opacity:.78}
.seg.just{animation:pop .3s var(--ease)}
.legend{display:grid;gap:5px;margin-top:10px}
.lg{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.lg i{width:9px;height:9px;border-radius:3px;flex:none}
.lg b{margin-left:auto;font:500 11.5px var(--mono);color:var(--fg)}
.nx{display:flex;gap:9px;padding:8px 0;border:0;border-top:1px solid var(--line);cursor:pointer;text-align:left;background:none;width:100%;color:var(--fg);font-size:13.5px}
.nx:first-of-type{border-top:0}
.nx i{width:7px;height:7px;border-radius:50%;margin-top:6px;flex:none}
.nx small{display:block;font:10.5px var(--mono);color:var(--faint)}
.hold{color:var(--muted);font-size:12.5px;margin:6px 0 0}
.conn .ci{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.cchip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer}
.cchip small{color:var(--faint);font:9.5px var(--mono);text-transform:uppercase;letter-spacing:.05em}
/* empty center */
.welcome{max-width:560px;margin:9vh auto 0;text-align:center;padding:0 20px}
.welcome h2{font-size:clamp(24px,3.4vw,36px);margin-bottom:10px}
.welcome p{color:var(--muted)}
.welcome .wrow{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.welcome input{min-width:min(300px,70vw)}
/* tab bar (phone) */
.tabbar{display:none}
/* overlays */
.ovl{position:fixed;inset:0;z-index:90;background:rgba(5,7,11,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;padding:10vh 16px 16px}
.pal{width:min(640px,100%);border-radius:18px;overflow:hidden;animation:slidein .18s var(--ease)}
.pal input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:17px;color:var(--fg)}
.pal input:focus{outline:none}
.pal .plist{max-height:46vh;overflow-y:auto;padding:6px}
.pal .pi{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--fg);padding:9px 12px;border-radius:10px;cursor:pointer;font-size:14.5px}
.pal .pi small{color:var(--faint);font:11px var(--mono);margin-left:auto;flex:none}
.pal .pi.act{background:rgba(109,184,238,.13)}
.pal .pi .dot{width:8px;height:8px;border-radius:50%;flex:none}
.pal .pgrp{font:500 10px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--faint);padding:10px 12px 4px}
.help{width:min(560px,100%);border-radius:18px;padding:20px 22px;animation:slidein .18s var(--ease)}
.help h3{font-size:18px;margin-bottom:12px}
.help table{border-collapse:collapse;font-size:14px}
.help td{padding:5px 14px 5px 0;vertical-align:top}
.help td:first-child{font:500 12px var(--mono);color:var(--l2);white-space:nowrap}
.schema{width:min(860px,100%);border-radius:18px;animation:slidein .18s var(--ease);max-height:82vh;display:flex;flex-direction:column}
.schema .shead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.schema .sbody{overflow-y:auto;padding:14px 20px}
.schema .sl{margin-bottom:18px}
.schema .sl input.lname{font:700 16px var(--display);background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--fg);padding:2px 0;min-width:140px}
.schema .sl input.ltag{background:transparent;border:0;color:var(--faint);font:12px var(--mono);min-width:220px}
.schema .sf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin:8px 0;padding:10px;border:1px solid var(--line);border-radius:10px;background:rgba(11,14,20,.4)}
.schema .sf label{font:500 9.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--faint);display:block}
.schema .sf input,.schema .sf select{background:rgba(11,14,20,.6);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:13px;width:100%;color:var(--fg)}
.ctxbtn{display:none}
/* boot skeleton */
.boot{flex:1;display:grid;grid-template-columns:320px 1fr 320px;gap:0;min-height:0}
.boot i{display:block;margin:14px;border-radius:14px;background:linear-gradient(100deg,rgba(255,255,255,.04) 40%,rgba(255,255,255,.09) 50%,rgba(255,255,255,.04) 60%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
[hidden]{display:none!important}
@media (max-width:1100px){
  .context{position:fixed;top:48px;right:0;bottom:0;width:min(350px,94vw);z-index:70;transform:translateX(105%);transition:transform .28s var(--ease);background:rgba(13,16,25,.92);box-shadow:-18px 0 44px rgba(0,0,0,.45)}
  .context.open{transform:none}
  #shell{grid-template-columns:300px minmax(0,1fr)}
  .ctxbtn{display:inline-block}
}
@media (max-width:760px){
  #shell{display:block;position:relative}
  .pane{display:none;height:100%}
  .pane.active{display:flex}
  .context{position:absolute;top:0;right:auto;bottom:0;width:100%;transform:none;background:rgba(15,18,28,.9)}
  .tabbar{display:flex;flex:none;height:52px;border-left:0;border-right:0;border-bottom:0;z-index:50}
  .tabbar button{flex:1;background:none;border:0;color:var(--muted);font:500 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .tabbar button.on{color:var(--fg)}
  .tabbar button .tdot{width:5px;height:5px;border-radius:50%;background:transparent}
  .tabbar button.on .tdot{background:var(--l2)}
  .brand h1{display:none}
  .brand{min-width:0}
  .tb-hide{display:none}
  .topbar{gap:8px;padding:0 10px}
  .cscroll{padding:14px 14px 18px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="bgfx"></div>
<header class="topbar glass" id="topbar"></header>
<div id="shell"><div class="boot" aria-hidden="true"><i></i><i></i><i></i></div></div>
<nav class="tabbar glass" id="tabbar" hidden></nav>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
const KEY='people-tracker-v1',SKEY='people-tracker-schema-v1';
const VERSION='3.0.0';
const DEFAULT_SCHEMA=[
 {id:'l1',name:'Context',tag:'Minutes · just ask',c:'#3ad6b5',fields:[
  {id:'home',s:'Where they are from',ask:'"Are you from around here?"',then:'"What was that like?"'},
  {id:'work',s:'What they do',ask:'"What do you do?"',askp:'"What is your role, and how long have you been in it?"',then:'"How did you get into that?"'},
  {id:'people',s:'Who is in their life',ask:'"Do you have family or friends nearby?"',askp:'"Who do you work with most?"',then:'"Who do you see most?"'},
  {id:'rhythm',s:'Typical week',ask:'"What does a normal week look like for you?"',askp:'"When is your busiest stretch?"',then:'"What do you protect time for?"'}]},
 {id:'l2',name:'Style',tag:'Minutes · watch, do not ask',c:'#6db8ee',fields:[
  {id:'comm',s:'How they communicate',type:'watch',ask:'Short or long? Direct or diplomatic? Text or call?',then:'Note how they open and close a conversation.'},
  {id:'energy',s:'Pace and energy',type:'watch',ask:'Fast or deliberate? Talker or listener?',then:'Who fills the silence?'},
  {id:'humor',s:'Humor',type:'watch',ask:'Dry, playful, self-deprecating, none?',then:'What gets a real laugh?'},
  {id:'friction',s:'Under pressure',type:'watch',ask:'How they act when stressed or when they disagree.',then:'Only log what you have actually seen.'}]},
 {id:'l3',name:'Current chapter',tag:'First hour · ask, then follow up',c:'#a595f3',fields:[
  {id:'project',s:'What they are working on',ask:'"What are you working on lately?"',then:'"What is the hardest part?"'},
  {id:'goal',s:'What they are aiming at',ask:'"What are you trying to get done this year?"',then:'"Why that, and why now?"'},
  {id:'strain',s:'What is weighing on them',ask:'"What has been the hardest part of this stretch?"',then:'"What would make it lighter?"'},
  {id:'look',s:'What they look forward to',ask:'"Anything you are looking forward to?"',then:'"Who will you do it with?"'}]},
 {id:'l4',name:'Values',tag:'Weeks · needs sharing both ways',c:'#f291b4',fields:[
  {id:'hill',s:'What they will not bend on',ask:'"What is a hill you would die on?"',then:'"When did that get tested?"'},
  {id:'invest',s:'Where time and money go',ask:'"Free Saturday, no obligations. What do you do?"',then:'"What would you cut last?"'},
  {id:'admire',s:'Who they admire',ask:'"Who do you look up to?"',then:'"What do you copy from them?"'},
  {id:'proud',s:'What they are proud of',ask:'"What are you proud of that people do not usually ask about?"',then:'"Who knows about it?"'}]},
 {id:'l5',name:'Story',tag:'Months or more · needs earned trust',c:'#ff8a63',fields:[
  {id:'turning',s:'Turning points',ask:'"What is a moment that changed your direction?"',then:'"What did you do the next day?"'},

function h(tag,props,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(k==='value'||k==='checked'||k==='hidden')e[k]=v;
    else e.setAttribute(k,v===true?'':v);
  }
  kids.flat().forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(String(c)))});
  return e;
}

const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function fmt(d){if(!d)return '';const [y,m,dd]=d.split('-').map(Number);return new Date(y,m-1,dd).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function rel(d){if(!d)return '—';const t=today();if(d===t)return 'today';const diff=Math.round((new Date(t)-new Date(d))/864e5);if(diff===1)return 'yesterday';if(diff>1&&diff<31)return diff+'d ago';if(diff>=31)return fmt(d);if(diff===-1)return 'tomorrow';return 'in '+(-diff)+'d'}
function doneF(p,f){return !!(((p.answers||{})[f.id]||'').trim())}

function uniqVals(key){const m=new Map();data.people.forEach(p=>{const v=(p[key]||'').trim();if(v)m.set(v.toLowerCase(),v)});return [...m.values()].sort()}
function suggFor(p,f){
  const freq=new Map();
  data.people.forEach(o=>{if(o.id===p.id)return;const v=((o.answers||{})[f.id]||'').trim();if(!v||v.length>60)return;const k=v.toLowerCase();freq.set(k,{v,n:(freq.get(k)||{n:0}).n+1})});
  return [...freq.values()].sort((a,b)=>b.n-a.n).slice(0,5).map(x=>x.v);
}
function connections(p){
  const out=[];
  const mine=(p.intro||'').trim().toLowerCase();
  data.people.forEach(o=>{
    if(o.id===p.id)return;
    if(mine&&(o.name||'').trim().toLowerCase()===mine)out.push({o,why:'Introduced you'});
    const oi=(o.intro||'').trim().toLowerCase();
    if(oi&&(p.name||'').trim().toLowerCase()===oi)out.push({o,why:'You introduced them'});
    if((p.where||'').trim()&&(p.where||'').trim().toLowerCase()===(o.where||'').trim().toLowerCase())out.push({o,why:'Met at '+p.where.trim()});
    if((p.location||'').trim()&&(p.location||'').trim().toLowerCase()===(o.location||'').trim().toLowerCase())out.push({o,why:'Lives in '+p.location.trim()});
    if((p.platform||'').trim()&&(p.platform||'').trim().toLowerCase()===(o.platform||'').trim().toLowerCase()&&p.mode!=='in-person')out.push({o,why:'Met on '+p.platform.trim()});
  });

}
function unlocked(p,li){
  if(li<3)return true;
  const fast=[0,1,2].reduce((a,i)=>a+(SCHEMA[i]?cov(p,SCHEMA[i]):0),0)/Math.max(1,[0,1,2].reduce((a,i)=>a+(SCHEMA[i]?SCHEMA[i].fields.length:0),0));
  if(li===3)return fast>=0.6;
  return fast>=0.6&&cov(p,SCHEMA[li-1])/Math.max(1,SCHEMA[li-1].fields.length)>=0.5;
}
function nextQuestion(p){return ALL.find(f=>!doneF(p,f)&&unlocked(p,f.li))||null}
function segStrip(p){

}

document.getElementById('importFile').addEventListener('change',e=>{

function fuzzy(q,s){q=q.toLowerCase();s=s.toLowerCase();let i=0;for(const ch of s){if(ch===q[i])i++;if(i===q.length)return true}return q.length===0}
function openPalette(){
  const p=person();
  const inp=h('input',{placeholder:p?'Jump to a person, a question, an action…':'Jump to a person, an action…','aria-label':'Command palette'});
  const list=h('div',{class:'plist'});
  let items=[],act=0;
  function build(){
    const query=inp.value.trim();
    items=[];
    const people=data.people.filter(x=>!query||fuzzy(query,x.name)).slice(0,7);
    if(people.length){items.push({grp:'People'});people.forEach(x=>items.push({label:x.name,sub:total(x)+' of '+maxTotal()+' answered',dot:'#6db8ee',run:()=>{selectPerson(x.id)}}))}
    if(p&&query){
      const qs=ALL.filter(f=>fuzzy(query,f.s)||fuzzy(query,(f.ask||''))).slice(0,6);
      if(qs.length){items.push({grp:'Questions for '+p.name});qs.forEach(f=>items.push({label:f.s,sub:f.L.name,dot:f.L.c,run:()=>{jumpTo(f,true)}}))}
    }
    const acts=[
      {label:'Add a person',sub:'N',run:()=>{const n=document.getElementById('railNew');if(n){n.focus();showPane('people')}}},
      ...(p?[{label:'Answer the next question for '+p.name,sub:'R',run:()=>{focusCapture()}}]:[]),
      {label:'Edit the questions',sub:'',run:()=>{openSchema()}},
      {label:'Export JSON',sub:'',run:exportJSON},
      {label:'Export CSV',sub:'',run:exportCSV},
      {label:'Import JSON',sub:'',run:()=>document.getElementById('importFile').click()}
    ].filter(a=>!query||fuzzy(query,a.label));
    if(acts.length){items.push({grp:'Actions'});acts.forEach(a=>items.push(a))}
    act=items.findIndex(i=>!i.grp);
    draw();
  }
  function draw(){
    list.textContent='';
    items.forEach((it,i)=>{
      if(it.grp){list.append(h('div',{class:'pgrp'},it.grp));return}
      list.append(h('button',{class:'pi'+(i===act?' act':''),onmouseenter:()=>{act=i;draw()},onclick:()=>{const r=it.run;closeOvl();r&&r()}},
        it.dot?h('span',{class:'dot',style:'background:'+it.dot}):null,it.label,h('small',{},it.sub||'')));
    });
  }
  inp.addEventListener('input',build);
  inp.addEventListener('keydown',e=>{
    const nav=items.map((it,i)=>it.grp?-1:i).filter(i=>i>=0);
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();let pos=nav.indexOf(act);pos=(pos+(e.key==='ArrowDown'?1:-1)+nav.length)%nav.length;act=nav[pos];draw();const els=list.querySelectorAll('.pi');const el=els[nav.indexOf(act)];if(el)el.scrollIntoView({block:'nearest'})}
    else if(e.key==='Enter'){e.preventDefault();const it=items[act];if(it&&it.run){const r=it.run;closeOvl();r()}}
  });
  openOvl(h('div',{class:'pal glass'},inp,list));
  build();inp.focus();
}

    field('lastContact','Last contact','date'),
    field('followUp','Follow up by','date'),
    field('birthday','Birthday','date'),
    field('location','Location','text'),
    field('phone','Phone','tel'),
    field('email','Email','email'),
    field('tags','Tags (comma separated)','text'),
    field('notes','Notes','textarea'));
  const layers=SCHEMA.map(L=>{
    const cnt=h('span',{class:'cnt','data-cnt':L.id},cov(p,L)+'/'+L.fields.length);
    const rows=h('div',{class:'rows'},L.fields.map(f=>{
      const row=h('div',{class:'row'+(doneF(p,f)?' on':''),id:'f-'+L.id+'-'+f.id,style:'--c:'+L.c});
      const ta=h('textarea',{class:'ans',value:p.answers[f.id]||'',placeholder:f.type==='watch'?'What you noticed':'Their answer','aria-label':'Answer for '+f.s,
        oninput:e=>{p.answers[f.id]=e.target.value;row.classList.toggle('on',doneF(p,f));cnt.textContent=cov(p,L)+'/'+L.fields.length;autosize(ta);touch()},
        onkeydown:e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();const nx2=nextQuestion(p);if(nx2)jumpTo(nx2,true)}}});
      const sg=suggFor(p,f);
      const sugg=!doneF(p,f)&&sg.length?h('div',{class:'sugg'},h('span',{},'Others said'),sg.map(v=>h('button',{onclick:()=>{p.answers[f.id]=v;touch();renderCenter();jumpTo(f,true)}},v))):null;
      row.append(h('div',{style:'min-width:0'},
        h('div',{class:'t'},f.s,f.type==='watch'?h('span',{class:'chip'},'watch'):null),
        h('div',{class:'ask'},askOf(p,f)),
        h('div',{class:'then'},h('b',{},f.type==='watch'?'note':'then'),f.then),
        ta,sugg));
      return row;
    }));
    return h('section',{class:'layer'},h('div',{class:'lh'},h('h2',{},h('i',{style:'background:'+L.c}),L.name),h('span',{class:'tag'},L.tag),h('button',{class:'btn sm',onclick:openSchema},'Edit questions'),cnt),rows);
  });
  const wrap=h('div',{class:'cwrap swap-in'},head,meta,
    h('div',{class:'rules'},
      h('div',{class:'rule glass'},h('b',{},'Trade, do not extract'),'Answer your own question right after they answer it.'),
      h('div',{class:'rule glass'},h('b',{},'Follow the last thing they said'),'Your next question is a follow up, not the next line on this list.'),
      h('div',{class:'rule glass'},h('b',{},'Deeper layers are earned'),'Values and Story come after the first three are mostly filled in.')),
    dl('platforms',PLATFORMS),dl('dl-where',uniqVals('where')),dl('dl-people',data.people.map(x=>x.name)),dl('dl-location',uniqVals('location')),
    form,layers);
  scroll.append(wrap);
  centerEl.append(scroll,cap);
  renderCapture(p);
  refreshIntroLink();
  scroll.querySelectorAll('textarea.ans').forEach(autosize);
}
function renderCenterSoft(){renderCenter()}
function renderRailSoft(){renderRail()}
function renderCapture(p){
  if(!capEl)return;
  capEl.textContent='';
  const nq=nextQuestion(p);
  const t=total(p),mt=maxTotal();
  if(!nq){
    capEl.append(h('div',{class:'cq'},h('span',{class:'qt'},'All '+mt+' questions answered for '+p.name+'.'),
      h('span',{class:'qa'},'Nice work. Re-ask the early ones in a few months.')));
  }else{
    const inp=h('input',{class:'in',id:'capIn',placeholder:nq.type==='watch'?'What you noticed':'Their answer — Enter saves and moves on','aria-label':'Capture answer',
      onkeydown:e=>{
        if(e.key==='Enter'){e.preventDefault();const v=inp.value.trim();if(v){p.answers[nq.id]=v;p.updated=Date.now();save();syncAnswerRow(p,nq);renderRail();renderContext(p,nq.id)}renderCapture(p);const ni=document.getElementById('capIn');if(ni)ni.focus()}
      }});
    capEl.append(
      h('div',{class:'cq'},h('span',{class:'lab',style:'color:'+nq.L.c},nq.L.name+' · next question'),h('span',{class:'qt'},nq.s),h('span',{class:'qa'},askOf(p,nq))),
      h('div',{class:'crow'},inp,h('button',{class:'btn primary',onclick:()=>{const i=document.getElementById('capIn');if(i)i.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter'}))}},'Save + next'),
        h('button',{class:'btn',onclick:()=>jumpTo(nq,true)},'Open in list')),
      h('div',{class:'cprog'},h('span',{},t+' of '+mt+' answered'),
        (p.lastContact||'')<today()?h('button',{onclick:()=>{p.lastContact=today();save();renderCenter();focusCapture()}},'Mark contacted today'):null,
        h('span',{},'R or Ctrl+. jumps here')));
  }
  capEl.append(h('div',{class:'pbar'},h('u',{style:'width:'+(mt?t/mt*100:0)+'%'})));
}
function syncAnswerRow(p,f){
  const row=document.getElementById('f-'+f.L.id+'-'+f.id);if(!row)return;
  const ta=row.querySelector('textarea.ans');if(ta&&ta.value!==p.answers[f.id]){ta.value=p.answers[f.id]||'';autosize(ta)}
  row.classList.toggle('on',doneF(p,f));
  const cnt=document.querySelector('[data-cnt="'+f.L.id+'"]');if(cnt)cnt.textContent=cov(p,f.L)+'/'+f.L.fields.length;
}
function focusCapture(){const i=document.getElementById('capIn');if(i){i.focus();showPane('person')}}
function jumpTo(f,focus){
  showPane('person');
  const sc=document.querySelector('.cscroll');const row=document.getElementById('f-'+f.L.id+'-'+f.id);if(!row||!sc)return;
  sc.scrollTo({top:row.offsetTop-sc.clientHeight/2+40,behavior:'smooth'});
  row.classList.add('flash');setTimeout(()=>row.classList.remove('flash'),900);
  if(focus){const ta=row.querySelector('textarea.ans');if(ta)setTimeout(()=>ta.focus(),350)}
}
function arc(r0,r1,a0,a1){
  const pt=(r,a)=>[180+r*Math.cos(a*Math.PI/180),180+r*Math.sin(a*Math.PI/180)];
  const [x1,y1]=pt(r1,a0),[x2,y2]=pt(r1,a1),[x3,y3]=pt(r0,a1),[x4,y4]=pt(r0,a0);
  return `M${x1} ${y1}A${r1} ${r1} 0 0 1 ${x2} ${y2}L${x3} ${y3}A${r0} ${r0} 0 0 0 ${x4} ${y4}Z`;
}
function renderContext(p,justId){
  ctxEl.querySelector('.ctxscroll').textContent='';
  const box=ctxEl.querySelector('.ctxscroll');
  if(!p){box.append(h('div',{class:'card'},h('h3',{},'At a glance'),h('p',{class:'hold'},data.people.length+' people tracked. Follow-ups due: '+data.people.filter(x=>x.followUp&&x.followUp<=today()).length+'.')));return}
  const ringCard=h('div',{class:'card'});
  const svg=document.createElementNS(NS,'svg');svg.setAttribute('id','ring');svg.setAttribute('class','ring');svg.setAttribute('viewBox','0 0 360 360');svg.setAttribute('role','img');svg.setAttribute('aria-label','Rings showing how much is known about this person');
  SCHEMA.forEach((L,li)=>{
    const r1=172-li*28,r0=r1-24,n=L.fields.length;if(!n)return;
    const step=360/n;
    L.fields.forEach((f,fi)=>{
      const a0=-90+fi*step+1.5;
      const el=document.createElementNS(NS,'path');
      el.setAttribute('d',arc(r0,r1,a0,a0+step-3));el.setAttribute('class','seg'+(justId&&f.id===justId&&doneF(p,f)?' just':''));
      el.setAttribute('fill',doneF(p,f)?L.c:'rgba(255,255,255,.06)');
      const t=document.createElementNS(NS,'title');t.textContent=L.name+': '+f.s;el.append(t);
      el.addEventListener('click',()=>jumpTo({...f,L},true));svg.append(el);
    });
  });
  const tx=(y,s,size,fill)=>{const c=document.createElementNS(NS,'text');c.setAttribute('x',180);c.setAttribute('y',y);c.setAttribute('text-anchor','middle');c.setAttribute('fill',fill);c.setAttribute('font-family','JetBrains Mono, monospace');c.setAttribute('font-size',size);c.textContent=s;svg.append(c)};
  tx(176,total(p),20,'var(--fg)');tx(194,'of '+maxTotal(),11,'var(--muted)');
  ringCard.append(svg,h('div',{class:'legend'},SCHEMA.map(L=>h('div',{class:'lg'},h('i',{style:'background:'+L.c}),L.name,h('b',{},cov(p,L)+'/'+L.fields.length)))));
  const nxCard=h('div',{class:'card'},h('h3',{},'Ask next'));
  const picks=ALL.filter(f=>!doneF(p,f)&&unlocked(p,f.li)).slice(0,4);
  if(!picks.length)nxCard.append(h('p',{class:'hold'},total(p)===maxTotal()?'Everything is filled in. Re-ask the early ones in a few months.':'What is left sits in deeper layers. Build the early ones first.'));
  picks.forEach(f=>nxCard.append(h('button',{class:'nx',onclick:()=>jumpTo(f,true)},h('i',{style:'background:'+f.L.c}),h('div',{},askOf(p,f),h('small',{},f.L.name+' · '+(f.type==='watch'?'watch':'ask'))))));
  const nl=SCHEMA.findIndex((L,li)=>!unlocked(p,li));
  if(nl>=0)nxCard.append(h('p',{class:'hold'},SCHEMA[nl].name+' waits until the first three layers are mostly filled in.'));
  const cnCard=h('div',{class:'card conn'},h('h3',{},'Connected'));
  const cs=connections(p);
  if(!cs.length)cnCard.append(h('p',{class:'hold'},'No links yet. Shared places, introducers, and hometowns will connect people here.'));
  else cnCard.append(h('div',{class:'ci'},cs.slice(0,14).map(c=>h('button',{class:'cchip',onclick:()=>selectPerson(c.o.id)},c.o.name,h('small',{},c.why)))));
  box.append(ringCard,nxCard,cnCard);
}
function autosize(ta){ta.style.height='auto';ta.style.height=Math.max(36,ta.scrollHeight+2)+'px'}
function selectPerson(id){
  selId=id;phonePane='person';
  renderRail();renderCenter();renderContext(person());
  if(window.innerWidth<=760)showPane('person');
  const sc=document.querySelector('.cscroll');if(sc)sc.scrollTop=0;
}
function renderAll(){
  renderTop();
  const shell=document.getElementById('shell');shell.textContent='';
  railEl=h('aside',{class:'pane rail glass'},h('div',{class:'railhead'},
    h('div',{class:'rrow'},
      h('input',{class:'in',id:'railNew',placeholder:'New person — Enter adds','aria-label':'New person name',maxlength:'60',onkeydown:e=>{if(e.key==='Enter'){const n=e.target.value.trim();if(!n)return;const np=newPerson(n);data.people.push(np);save();e.target.value='';selectPerson(np.id);focusCapture()}}})),
    h('div',{class:'rrow'},
      h('input',{class:'in',id:'railFilter',placeholder:'Filter  ( / )',value:railQ,'aria-label':'Filter people',oninput:e=>{railQ=e.target.value;railCursor=0;renderRail();const n=document.getElementById('railFilter');const pos=e.target.selectionStart;if(n){n.focus();n.setSelectionRange(pos,pos)}}}),
      (()=>{const s=h('select',{class:'sel','aria-label':'Sort',onchange:e=>{railSort=e.target.value;renderRail()}},
        [['recent','Recent'],['met','Met'],['az','A–Z'],['least','Least known'],['follow','Follow-up']].map(([v,l])=>h('option',{value:v,selected:railSort===v},l)));return s})(),
      (()=>{const s=h('select',{class:'sel','aria-label':'Status filter',onchange:e=>{railStatus=e.target.value;renderRail()}},
        ['','new','active','fading','paused'].map(v=>h('option',{value:v,selected:railStatus===v},v||'All')));return s})())),
    h('div',{class:'raillist',id:'raillist'}));
  listEl=railEl.querySelector('#raillist');
  centerEl=h('main',{class:'pane center'});
  ctxEl=h('aside',{class:'pane context glass'+(ctxOpen?' open':'')},h('div',{class:'ctxscroll'}));
  shell.append(railEl,centerEl,ctxEl);
  if(!selId&&data.people.length)selId=railList()[0].id;
  renderRail();renderCenter();renderContext(person());
  if(window.innerWidth<=760)showPane(selId?'person':'people');
  else{railEl.classList.add('active');centerEl.classList.add('active');ctxEl.classList.add('active')}
  if(msg){const m=msg;msg='';const d=h('div',{class:'cprog'},'');}
}

/* keyboard */
document.addEventListener('keydown',e=>{
  const ae=document.activeElement;
  const typing=ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&ae.id!=='railFilter';
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();ovl?closeOvl():openPalette();return}
  if((e.ctrlKey||e.metaKey)&&e.key==='.'){e.preventDefault();focusCapture();return}
  if(e.key==='Escape'){
    if(ovl){closeOvl();return}
    if(ctxOpen){ctxOpen=false;ctxEl.classList.remove('open');return}
    if(ae&&ae.id==='capIn'){ae.blur();return}
    return;
  }
  if(ovl)return;
  if(e.key==='?'&&!typing){e.preventDefault();openHelp();return}
  if(typing)return;
  if(e.key==='/'&&ae.id!=='railFilter'){e.preventDefault();const f=document.getElementById('railFilter');if(f){showPane('people');f.focus()}return}
  if((e.key==='n'||e.key==='N')){e.preventDefault();const n=document.getElementById('railNew');if(n){showPane('people');n.focus()}return}
  if((e.key==='r'||e.key==='R')&&person()){e.preventDefault();focusCapture();return}
  if((e.key==='c'||e.key==='C')&&window.innerWidth<=1100&&window.innerWidth>760){ctxOpen=!ctxOpen;ctxEl.classList.toggle('open',ctxOpen);return}
  if(e.key==='ArrowDown'||e.key==='ArrowUp'||e.key==='j'||e.key==='k'){
    const list=railList();if(!list.length)return;
    e.preventDefault();
    railCursor=Math.min(list.length-1,Math.max(0,railCursor+((e.key==='ArrowDown'||e.key==='j')?1:-1)));
    const it=listEl.querySelectorAll('.pitem')[railCursor];if(it){it.scrollIntoView({block:'nearest'});listEl.querySelectorAll('.pitem').forEach(x=>x.style.borderColor='');it.style.borderColor='rgba(109,184,238,.6)'}
    return;
  }
  if(e.key==='Enter'&&ae.id!=='railNew'){
    const list=railList();const p=list[railCursor];if(p&&(ae===document.body||ae.classList.contains('pitem')))selectPerson(p.id);
  }
});

/* parallax background */
(function(){
  const bg=document.getElementById('bgfx');if(!bg)return;
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  let mx=0,my=0,raf=0;
  function apply(){bg.style.transform='translate3d('+(mx*14)+'px,'+(my*10)+'px,0)';raf=0}
  window.addEventListener('mousemove',e=>{mx=e.clientX/window.innerWidth-.5;my=e.clientY/window.innerHeight-.5;if(!raf)raf=requestAnimationFrame(apply)},{passive:true});
})();
load();renderAll();
</script>
