<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>New Contacts Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:dark;
  --ink:#080b12;--fg:#eef1f8;--muted:rgba(238,241,248,.62);--faint:rgba(238,241,248,.38);
  --glass:rgba(255,255,255,.065);--glass2:rgba(255,255,255,.11);--edge:rgba(255,255,255,.14);--hi:rgba(255,255,255,.22);
  --l1:#3ad6b5;--l2:#6db8ee;--l3:#a595f3;--l4:#f291b4;--l5:#ff8a63;
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --body:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.22,.8,.3,1);
}
*{box-sizing:border-box}
html{background:var(--ink)}
html,body{height:100%}
body{margin:0;color:var(--fg);font:14.5px/1.5 var(--body);height:100dvh;overflow:hidden;position:relative}
.orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orbs i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
.orbs i:nth-child(1){width:520px;height:520px;background:#1f9d8c;left:-120px;top:-100px}
.orbs i:nth-child(2){width:600px;height:600px;background:#5b4bd1;right:-160px;top:12%}
.orbs i:nth-child(3){width:460px;height:460px;background:#c4466f;left:30%;bottom:-180px;opacity:.4}
.orbs i:nth-child(4){width:340px;height:340px;background:#e0693f;right:18%;bottom:8%;opacity:.28}
@media (prefers-reduced-motion:no-preference){.orbs i{animation:drift 26s ease-in-out infinite alternate}.orbs i:nth-child(2){animation-duration:32s}.orbs i:nth-child(3){animation-duration:38s}}
@keyframes drift{to{transform:translate(40px,30px)}}
.glass{background:linear-gradient(145deg,var(--glass2),var(--glass));border:1px solid var(--edge);border-radius:20px;backdrop-filter:blur(24px) saturate(165%);-webkit-backdrop-filter:blur(24px) saturate(165%);box-shadow:inset 0 1px 0 var(--hi),0 18px 50px rgba(0,0,0,.28)}
h1,h2,h3{font-family:var(--display);margin:0;font-weight:700;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--l2);outline-offset:2px;border-radius:6px}
@keyframes swapin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes slidein{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.88)}55%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes savedot{0%{transform:scale(1)}40%{transform:scale(1.55)}100%{transform:scale(1)}}
.swap-in{animation:swapin .22s var(--ease)}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tag{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
/* shell */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;height:100dvh;padding:18px;max-width:1920px;margin:0 auto}
.side{padding:18px 14px;display:flex;flex-direction:column;gap:6px;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 6px;font:700 17.5px/1.15 var(--display)}
.brand b{width:30px;height:30px;border-radius:10px;background:conic-gradient(from 200deg,var(--l1),var(--l2),var(--l3),var(--l4),var(--l5),var(--l1));box-shadow:0 0 18px rgba(165,149,243,.5);flex:none}
.brandver{padding:0 8px 14px;font:500 10.5px var(--mono);color:var(--faint)}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:var(--muted);cursor:pointer;border:1px solid transparent;font-weight:500;background:none;width:100%;text-align:left;font-size:14.5px;transition:background .15s,color .15s}
.nav:hover{background:var(--glass);color:var(--fg)}
.nav.on{background:var(--glass2);border-color:var(--edge);color:var(--fg);box-shadow:inset 0 1px 0 var(--hi)}
.nav u{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.7;text-decoration:none;flex:none}
.nav.on u{background:var(--l1);opacity:1;box-shadow:0 0 10px var(--l1)}
.nav .nb{margin-left:auto;font:500 11px var(--mono);color:var(--faint)}
.nav.on .nb{color:var(--muted)}
.sp{flex:1}
.sidebox{display:grid;gap:8px}
.savedline{display:flex;align-items:center;gap:8px;font:500 10.5px var(--mono);color:var(--faint);padding:0 4px}
.savedot{width:8px;height:8px;border-radius:50%;background:var(--l1);opacity:.35;flex:none}
.savedot.tick{opacity:1;animation:savedot .45s var(--ease)}
.btn{background:var(--glass2);border:1px solid var(--edge);color:var(--fg);padding:8px 13px;border-radius:12px;font:500 13.5px var(--body);cursor:pointer;box-shadow:inset 0 1px 0 var(--hi);transition:background .15s,transform .15s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.17)}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--l1),var(--l2));color:#06231f;border:0;font-weight:600}
.btn.danger{color:#ff9d8a}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:9px}
.btn .k{font:500 10.5px var(--mono);color:var(--faint);margin-left:7px}
main{min-width:0;display:flex;flex-direction:column;gap:18px;min-height:0}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 16px;flex:none}
.top h1{font-size:22px;margin-right:auto}
.search{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.22);border:1px solid var(--edge);border-radius:12px;padding:8px 12px;min-width:210px}
.search input{background:none;border:0;outline:0;color:var(--fg);font:inherit;width:100%;min-width:0}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--l4),var(--l3));display:grid;place-items:center;font:700 13px var(--display);color:#1b0f2a;flex:none}
#view{flex:1;min-height:0;position:relative}
.scroll{overflow-y:auto;height:100%;display:flex;flex-direction:column;gap:18px;padding-bottom:4px;scrollbar-width:thin}
/* overview */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px}
.kpi{padding:16px 18px}
.kpi b{display:block;font:500 30px var(--mono);margin:4px 0 2px}
.kpi small{color:var(--muted)}
.up{color:var(--l1)}.dn{color:var(--l5)}
.grid12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card{padding:18px;min-width:0}
.card h3{font-size:16px;margin-bottom:2px}
.card .sub{color:var(--muted);font-size:12.5px;margin-bottom:12px}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
.axis{fill:var(--faint);font:10.5px var(--mono)}
.grid-l{stroke:rgba(255,255,255,.08);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.donutwrap{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}
.person{display:grid;grid-template-columns:190px minmax(0,1fr);gap:16px;align-items:start}
.fact{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;margin-top:12px}
.fact div{font-size:12.5px;color:var(--muted)}
.fact b{display:block;color:var(--fg);font-weight:600;font-size:14px}
.nx{display:flex;gap:10px;padding:9px 0;border-top:1px solid rgba(255,255,255,.08);font-size:13.5px;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:var(--fg);cursor:pointer;text-align:left}
.nx i{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
.nx small{display:block;font:11px var(--mono);color:var(--faint)}
.minlist{display:grid;gap:2px}
.minrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:11px;cursor:pointer;background:none;border:0;color:var(--fg);text-align:left;width:100%;font-size:14px}
.minrow:hover{background:rgba(255,255,255,.07)}
.minrow .mr{margin-left:auto;font:11px var(--mono);color:var(--faint);flex:none}
/* people table */
.tw{overflow-x:auto}
table.ptable{width:100%;border-collapse:separate;border-spacing:0 6px;min-width:760px}
.ptable th{text-align:left;font:500 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--faint);padding:2px 12px}
.ptable td{padding:10px 12px;background:rgba(255,255,255,.045);white-space:nowrap;font-size:14px}
.ptable td:first-child{border-radius:12px 0 0 12px;font-weight:600}
.ptable td:last-child{border-radius:0 12px 12px 0}
.ptable tr.r{cursor:pointer}
.ptable tr.r:hover td{background:rgba(255,255,255,.1)}
.pill{font:500 11px var(--mono);padding:3px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.who{display:inline-flex;align-items:center;gap:10px}
.who s{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 11px var(--display);color:#10131c;text-decoration:none;flex:none}
.segstrip{display:inline-flex;gap:3px;vertical-align:middle}
.segstrip i{width:22px;height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;display:block}
.segstrip i u{display:block;height:100%}
/* people workspace */
.ws{display:grid;grid-template-columns:292px minmax(0,1fr) 292px;gap:18px;height:100%;min-height:0}
.wscol{min-height:0;min-width:0;display:flex;flex-direction:column}
.railcard{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.railhead{padding:14px 14px 10px;display:flex;flex-direction:column;gap:8px;flex:none}
.railhead .rrow{display:flex;gap:8px}
.in,.sel2{background:rgba(0,0,0,.22);border:1px solid var(--edge);border-radius:11px;padding:8px 12px;font-size:14px;min-width:0;transition:border-color .15s,box-shadow .15s;color:var(--fg)}
.in:focus,.sel2:focus{border-color:var(--l2);box-shadow:0 0 0 3px rgba(109,184,238,.16);outline:none}
.railhead .in{flex:1}
.railhead .sel2{font-size:12.5px;padding:7px 8px}
.raillist{flex:1;overflow-y:auto;padding:4px 8px 10px;scrollbar-width:thin}
.pitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:12px;padding:9px 11px;cursor:pointer;color:var(--fg);transition:background .13s,border-color .13s}
.pitem:hover{background:rgba(255,255,255,.05)}
.pitem.sel{background:var(--glass2);border-color:var(--edge)}
.pitem .pn{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px}
.pitem .pn .dot{width:7px;height:7px;border-radius:50%;flex:none}
.pitem .pm{font:11px var(--mono);color:var(--faint);text-align:right;padding-top:3px}
.pitem .ps{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin-top:3px}
.pitem .pc{font:10.5px var(--mono);color:var(--muted)}
.pitem .pl{font:11px var(--mono);color:var(--faint);margin-left:auto}
.railempty{padding:22px 14px;color:var(--muted);font-size:13.5px;text-align:center}
.centerwrap{flex:1;display:flex;flex-direction:column;min-height:0;gap:18px}
.cscroll{flex:1;overflow-y:auto;min-height:0;scrollbar-width:thin}
.cinner{padding:20px 22px 22px}
.phead2{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.phead2 .nm{flex:1 1 200px;min-width:0;background:transparent;border:0;border-bottom:1px solid transparent;font:700 clamp(23px,2.6vw,32px) var(--display);padding:2px 0;color:var(--fg);letter-spacing:-.01em}
.phead2 .nm:focus{outline:none;border-bottom-color:var(--l2)}
.seg2{display:inline-flex;border:1px solid var(--edge);border-radius:11px;overflow:hidden;flex:none}
.seg2 button{background:rgba(0,0,0,.22);color:var(--muted);border:0;font-size:12.5px;padding:7px 12px;cursor:pointer}
.seg2 button[aria-pressed="true"]{background:var(--glass2);color:var(--fg)}
.pmeta{font:12px var(--mono);color:var(--faint);margin-bottom:16px;display:flex;flex-wrap:wrap;gap:4px 16px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:20px}
.form label{display:block;font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.form .in,.form .sel2{width:100%}
.form .wide{grid-column:1/-1}
.form textarea{width:100%;min-height:60px;resize:vertical}
.linkline{font-size:12px;margin-top:5px;color:var(--muted)}
.linkline button{background:none;border:0;color:var(--l2);cursor:pointer;font-size:12px;padding:0}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.rule{border-radius:16px;padding:12px 15px;font-size:13px;color:var(--muted)}
.rule b{display:block;color:var(--fg);font:700 13.5px var(--display)}
.layer{margin-bottom:20px}
.lh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-bottom:8px}
.lh h2{font-size:17px;display:flex;align-items:center;gap:9px}
.lh h2 i{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.lh .cnt{margin-left:auto;font:500 12px var(--mono);color:var(--muted)}
.rows{border-radius:16px;overflow:hidden;background:rgba(255,255,255,.035);border:1px solid var(--edge)}
.row{padding:11px 14px;border-top:1px solid rgba(255,255,255,.07);transition:background .3s}
.row:first-child{border-top:0}
.row.flash{background:rgba(109,184,238,.13)}
.row .t{font-weight:600;font-size:14.5px}
.row.on .t{color:var(--muted)}
.row .ask{font-size:14px;margin-top:1px}
.row.on .ask{color:var(--faint)}
.row .then{font-size:12.5px;color:var(--muted);margin-top:1px}
.row .then b{font:500 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-right:6px}
.chip{font:500 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--edge);border-radius:4px;padding:1px 5px;margin-left:8px}
.row textarea.ans{width:100%;resize:none;overflow:hidden;min-height:36px;background:rgba(0,0,0,.22);border:1px solid var(--edge);border-radius:10px;font-size:14px;padding:7px 10px;margin-top:7px;transition:border-color .18s,box-shadow .18s;color:var(--fg)}
.row textarea.ans::placeholder{color:var(--faint)}
.row textarea.ans:focus{border-color:var(--c,var(--l2));box-shadow:0 0 0 3px rgba(109,184,238,.14);outline:none}
.row.on textarea.ans{border-color:var(--c)}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center}
.sugg span{font:9.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.sugg button{background:rgba(255,255,255,.05);border:1px solid var(--edge);color:var(--muted);border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer}
.sugg button:hover{color:var(--fg)}
.capture{flex:none;padding:13px 16px 14px}
.capture .cq{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.capture .cq .lab{font:500 9.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;flex:none}
.capture .cq .qt{font-weight:600;font-size:14.5px}
.capture .cq .qa{color:var(--muted);font-size:13.5px}
.capture .crow{display:flex;gap:8px;margin-top:9px}
.capture input{flex:1}
.capture .cprog{display:flex;gap:14px;align-items:center;margin-top:8px;font:10.5px var(--mono);color:var(--faint);flex-wrap:wrap}
.capture .cprog button{background:none;border:0;color:var(--muted);cursor:pointer;font:500 10.5px var(--mono);padding:0;text-decoration:underline}
.capture .pbar{height:4px;border-radius:2px;background:rgba(255,255,255,.09);margin-top:9px;overflow:hidden}
.capture .pbar u{display:block;height:100%;background:linear-gradient(90deg,var(--l1),var(--l2));transition:width .35s var(--ease)}
.ctxcol{gap:18px;overflow-y:auto;scrollbar-width:thin;padding-bottom:4px}
.ctxcard{padding:16px}
.ctxcard h3{font-size:15px;margin-bottom:8px}
svg.ring{display:block;width:100%;height:auto;max-width:280px;margin:0 auto;overflow:visible}
.seg{stroke:rgba(255,255,255,.12);stroke-width:1;cursor:pointer;transition:opacity .18s}
.seg:hover{opacity:.78}
.seg.just{animation:pop .3s var(--ease)}
.legend2{display:grid;gap:5px;margin-top:10px}
.lg2{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.lg2 i{width:9px;height:9px;border-radius:3px;flex:none}
.lg2 b{margin-left:auto;font:500 11.5px var(--mono);color:var(--fg)}
.hold{color:var(--muted);font-size:12.5px;margin:6px 0 0}
.cchip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.05);border:1px solid var(--edge);color:var(--fg);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;margin:0 6px 6px 0}
.cchip small{color:var(--faint);font:9.5px var(--mono);text-transform:uppercase;letter-spacing:.05em}
.welcome{max-width:540px;margin:7vh auto 0;text-align:center;padding:0 20px}
.welcome h2{font-size:clamp(23px,3vw,33px);margin-bottom:10px}
.welcome p{color:var(--muted)}
.welcome .wrow{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.welcome input{min-width:min(300px,70vw)}
.panetabs{display:none}
/* follow ups + export lists */
.frow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;background:rgba(255,255,255,.045);margin-bottom:6px;cursor:pointer;border:1px solid transparent}
.frow:hover{background:rgba(255,255,255,.09)}
.frow .fm{margin-left:auto;text-align:right;font:11.5px var(--mono);color:var(--muted);flex:none}
.frow .fm b{display:block;font-size:13px;color:var(--fg)}
.frow.overdue .fm b{color:var(--l5)}
.stat5{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:18px}
.stat5 .kpi b{font-size:26px}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{background:rgba(0,0,0,.22);border:1px solid var(--edge);color:var(--muted);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer}
.tab.on{background:var(--glass2);color:var(--fg);border-color:var(--hi)}
.tab .nb{font:10.5px var(--mono);color:var(--faint);margin-left:6px}
.snaprow{display:flex;align-items:center;gap:12px;padding:9px 14px;border-radius:14px;background:rgba(255,255,255,.04);margin-bottom:5px;cursor:pointer;border:1px solid transparent}
.snaprow:hover{background:rgba(255,255,255,.09)}
.snaprow .sn{min-width:0}
.snaprow .sn .nm2{font-weight:600;font-size:14.5px}
.snaprow .sn .un{font:11.5px var(--mono);color:var(--faint)}
.snaprow .sm{margin-left:auto;display:flex;align-items:center;gap:12px;flex:none;font:11.5px var(--mono);color:var(--muted)}
/* overlays */
.ovl{position:fixed;inset:0;z-index:90;background:rgba(4,6,10,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;padding:10vh 16px 16px}
.pal{width:min(640px,100%);border-radius:18px;overflow:hidden;animation:slidein .18s var(--ease)}
.pal input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--edge);padding:16px 18px;font-size:17px;color:var(--fg)}
.pal input:focus{outline:none}
.pal .plist{max-height:46vh;overflow-y:auto;padding:6px}
.pal .pi{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--fg);padding:9px 12px;border-radius:10px;cursor:pointer;font-size:14.5px}
.pal .pi small{color:var(--faint);font:11px var(--mono);margin-left:auto;flex:none}
.pal .pi.act{background:rgba(109,184,238,.15)}
.pal .pi .dot{width:8px;height:8px;border-radius:50%;flex:none}
.pal .pgrp{font:500 10px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--faint);padding:10px 12px 4px}
.help{width:min(560px,100%);border-radius:18px;padding:20px 22px;animation:slidein .18s var(--ease)}

function h(tag,props,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(k==='value'||k==='checked'||k==='hidden')e[k]=v;
    else e.setAttribute(k,v===true?'':v);
  }
  kids.flat().forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(String(c)))});
  return e;
}

function unlocked(p,li){
  if(li<3)return true;
  const fast=[0,1,2].reduce((a,i)=>a+(SCHEMA[i]?cov(p,SCHEMA[i]):0),0)/Math.max(1,[0,1,2].reduce((a,i)=>a+(SCHEMA[i]?SCHEMA[i].fields.length:0),0));
  if(li===3)return fast>=0.6;
  return fast>=0.6&&cov(p,SCHEMA[li-1])/Math.max(1,SCHEMA[li-1].fields.length)>=0.5;
}

function parseSnapHTML(text){
  const doc=new DOMParser().parseFromString(text,'text/html');
  const LISTMAP={'Friends':0,'Friend Requests Sent':1,'Deleted Friends':2,'Hidden Friend Suggestions':3};
  const sources=[],rows=[];
  const sidx=s=>{if(!sources.includes(s))sources.push(s);return sources.indexOf(s)};
  const heads=[...doc.querySelectorAll('h1,h2,h3')];
  heads.forEach(hd=>{
    const name=hd.textContent.trim();if(!(name in LISTMAP))return;
    let el=hd.nextElementSibling;
    while(el&&el.tagName!=='TABLE')el=el.nextElementSibling;
    if(!el){const t=hd.parentElement&&hd.parentElement.querySelector('table');if(t)el=t}
    if(!el)return;
    el.querySelectorAll('tr').forEach(tr=>{
      const cells=[...tr.querySelectorAll('td')].map(td=>td.textContent.trim());
      if(cells.length<5)return;
      const[user,disp,created,,source]=cells;
      const date=/^\d{4}-\d{2}-\d{2}/.test(created||'')?created.slice(0,10):'';
      rows.push([user,disp,date,LISTMAP[name],sidx((source||'').replace(/^added by /,''))]);
    });
  });
  if(!rows.length)throw new Error('no rows');
  return{lists:['Friends','Requests sent','Deleted friends','Suggestions'],sources,rows};
}

  };

});

    h('div',{class:'pk-ctx',id:'pkctx'}),
    h('div',{class:'pk-tabs',id:'pktabs',role:'tablist'}),
    h('div',{class:'pk-jump',id:'pkjump'},h('kbd',{},'/'),h('input',{id:'pkq',placeholder:'Jump to anything: psych, nursing, hiking, dry humor','aria-label':'Jump to any option',autocomplete:'off'})),
    h('div',{class:'pk-res',id:'pkres',hidden:true}),
    h('div',{class:'pk-crumbs',id:'pkcrumbs'}),
    h('div',{class:'pk-opts',id:'pkopts'}),
    h('button',{class:'pk-more',id:'pkmore',hidden:true}),
    h('div',{class:'pk-here',id:'pkhere'}),
    h('div',{class:'pk-hint',id:'pkhint'}));
  const card2=h('section',{class:'glass card'},
    h('div',{class:'pk-head'},h('h2',{style:'font-size:16px'},'This person'),h('span',{class:'tag',id:'pkcnt'},'0 details')),
    h('div',{class:'pk-tray',id:'pktray'}),
    h('div',{class:'pk-bar'},
      h('button',{class:'btn pri',onclick:()=>pkSavePerson(false)},pkEditing?'Save details':'Save person'),
      h('button',{class:'btn',onclick:()=>pkSavePerson(true)},'Save and add another'),
      h('button',{class:'btn',onclick:()=>download('people-picker-people-'+today()+'.json',JSON.stringify({people:PK_PEOPLE},null,2),'application/json')},'Export people JSON'),
      h('button',{class:'btn',onclick:()=>download('people-picker-log-'+today()+'.json',JSON.stringify({log:PK_LOG},null,2),'application/json')},'Export log JSON'),
      (()=>{let armed=false;return h('button',{class:'btn',onclick:e=>{if(!armed){armed=true;e.target.textContent='Click again to clear';setTimeout(()=>{armed=false;e.target.textContent='Clear log'},3000)}else{PK_LOG=[];pkSaveLog();armed=false;e.target.textContent='Clear log';pkRender()}}},'Clear log')})()),
    h('pre',{class:'pk-pre',id:'pkjson'}));
  const card3=h('section',{class:'glass card'},
    h('div',{class:'pk-head'},h('h2',{style:'font-size:16px'},'Ranking accuracy'),h('span',{class:'tag'},'From your own log')),
    h('div',{class:'pk-stats',id:'pkstats'}),
    h('div',{class:'grid12',style:'margin-top:14px'},
      h('div',{class:'c6'},h('h3',{style:'font-size:14px;margin-bottom:6px'},'Picks by area'),(()=>{const s=document.createElementNS(NS,'svg');s.setAttribute('class','chart');s.id='pkchart-dom';return s})()),
      h('div',{class:'c6'},h('h3',{style:'font-size:14px;margin-bottom:6px'},'Most picked'),(()=>{const s=document.createElementNS(NS,'svg');s.setAttribute('class','chart');s.id='pkchart-top';return s})())));
  inner.append(card1,card2,card3);
  wrap.append(inner);
  viewEl.append(wrap);
  PK_EL={ctx:card1.querySelector('#pkctx'),tabs:card1.querySelector('#pktabs'),jump:card1.querySelector('#pkjump'),q:card1.querySelector('#pkq'),res:card1.querySelector('#pkres'),crumbs:card1.querySelector('#pkcrumbs'),opts:card1.querySelector('#pkopts'),more:card1.querySelector('#pkmore'),here:card1.querySelector('#pkhere'),hint:card1.querySelector('#pkhint'),tray:card2.querySelector('#pktray'),cnt:card2.querySelector('#pkcnt'),json:card2.querySelector('#pkjson'),stats:card3.querySelector('#pkstats')};
  PK_EL.q.addEventListener('input',pkJumpInput);
  PK_EL.q.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const f=PK_EL.res.querySelector('button');if(f)f.click()}if(e.key==='Escape'){PK_EL.q.value='';PK_EL.res.hidden=true;PK_EL.q.blur()}});
  PK_EL.tabs.addEventListener('keydown',e=>{
    const names=pkVisibleDomains();let i=names.indexOf(pkDom);
    if(e.key==='ArrowRight')i=(i+1)%names.length;else if(e.key==='ArrowLeft')i=(i+names.length-1)%names.length;
    else if(e.key==='ArrowDown'){e.preventDefault();pkFocusIdx=0;pkRender();return}
    else return;
    e.preventDefault();pkDom=names[i];pkPath=[];pkShowAll=false;pkFocusTab=true;pkRender();
  });
  PK_EL.opts.addEventListener('keydown',e=>{
    const items=[...PK_EL.opts.children];const i=items.indexOf(document.activeElement);if(i<0)return;
    const cols=getComputedStyle(PK_EL.opts).gridTemplateColumns.split(' ').length||1;
    let j=i;
    if(e.key==='ArrowRight')j=Math.min(items.length-1,i+1);
    else if(e.key==='ArrowLeft')j=Math.max(0,i-1);
    else if(e.key==='ArrowDown')j=Math.min(items.length-1,i+cols);
    else if(e.key==='ArrowUp'){if(i-cols<0){if(pkStage==='pick'){e.preventDefault();pkFocusTab=true;pkRender()}return}j=i-cols}
    else if(e.key==='Home')j=0;else if(e.key==='End')j=items.length-1;
    else return;
    e.preventDefault();items[j].focus();
  });
  pkRender();
}
function pkRender(){
  if(!PK_EL)return;
  const inStage=pkStage!=='pick';
  PK_EL.tabs.hidden=inStage;PK_EL.jump.hidden=inStage;PK_EL.res.hidden=true;PK_EL.here.textContent='';
  /* context chips */
  const c=PK_EL.ctx;c.textContent='';
  [['mode','How'],['source','Where'],['age','Age']].forEach(([k,l])=>{
    if(!pkCtx[k])return;
    const b=h('button',{class:'pk-cx','aria-label':'Change '+l,onclick:()=>{pkStage=k;pkFocusIdx=0;pkRender()}},h('b',{},l),pkCtx[k]);
    c.append(b);
  });
  const cr=PK_EL.crumbs;cr.textContent='';
  const o=PK_EL.opts;o.textContent='';
  let ord,parent;
  if(inStage){
    const back=h('button',{class:'pk-back',disabled:pkStage==='mode',onclick:()=>{pkStage=pkStage==='age'?'source':'mode';pkFocusIdx=0;pkRender()}},'← Back');
    cr.append(back,h('span',{class:'pk-title'},PK_STAGE_TITLE[pkStage]));
    ord=pkStageList();parent='';
    PK_EL.more.hidden=true;
    ord.forEach((n,i)=>{
      const b=h('button',{class:'pk-opt',style:'--c:#3ad6b5',onclick:()=>pkStagePick(n)},h('span',{class:'n'},i<9?String(i+1):''),h('span',{class:'l'},n.n),h('span',{class:'go'},''));
      o.append(b);
    });
    PK_EL.hint.replaceChildren(h('span',{},h('kbd',{},'←'),h('kbd',{},'→'),' move'),h('span',{},h('kbd',{},'Enter'),' pick'),h('span',{},h('kbd',{},'1'),'-',h('kbd',{},'9'),' quick pick'),h('span',{},h('kbd',{},'Backspace'),' back'));
  }else{
    if(!pkVisibleDomains().includes(pkDom)){pkDom=pkVisibleDomains()[0];pkPath=[]}
    const tabs=PK_EL.tabs;tabs.textContent='';
    pkVisibleDomains().forEach(d=>{
      const b=h('button',{class:'pk-tab',style:'--c:'+PK_TREE[d].c,role:'tab','aria-selected':d===pkDom?'true':'false',tabIndex:d===pkDom?0:-1,onclick:()=>{pkDom=d;pkPath=[];pkShowAll=false;pkFocusIdx=0;pkRender()}},h('i',{}),d);
      tabs.append(b);
    });
    const back=h('button',{class:'pk-back',disabled:!pkPath.length,onclick:pkUp},'← Up');
    cr.append(back);
    const root=h('button',{class:'pk-crumb'+(pkPath.length?'':' cur'),onclick:()=>{pkPath=[];pkShowAll=false;pkFocusIdx=0;pkRender()}},pkDom);
    cr.append(root);
    pkPath.forEach((n,i)=>{cr.append(h('span',{class:'sep'},'›'));cr.append(h('button',{class:'pk-crumb'+(i===pkPath.length-1?' cur':''),onclick:()=>{pkPath=pkPath.slice(0,i+1);pkShowAll=false;pkFocusIdx=0;pkRender()}},n))});
    parent=pkPath.join('>');
    ord=pkOrder(pkNode(),pkDom,parent);
    const shown=pkShowAll?ord:ord.slice(0,PK_LIMIT);
    const rank=pkCtx.mode&&ord.length>4;
    shown.forEach((n,i)=>{
      const p=pkPath.concat(n.n);
      const b=h('button',{class:'pk-opt'+(rank&&i<3?' likely':''),style:'--c:'+PK_TREE[pkDom].c,'aria-pressed':pkHas(pkDom,p)?'true':'false',onclick:()=>pkChoose(n,ord)},
        h('span',{class:'n'},i<9?String(i+1):''),h('span',{class:'l'},n.n),
        rank&&i<3?h('span',{class:'lk'},'likely'):null,
        h('span',{class:'go'},n.k?'›':(pkHas(pkDom,p)?'✓':'')));
      o.append(b);
    });
    const more=PK_EL.more;
    if(ord.length>PK_LIMIT){more.hidden=false;more.textContent=pkShowAll?'Show fewer':'More ('+(ord.length-PK_LIMIT)+')';more.onclick=()=>{pkShowAll=!pkShowAll;pkFocusIdx=pkShowAll?PK_LIMIT:0;pkRender()}}else more.hidden=true;
    if(pkPath.length){
      const s=h('button',{class:'btn pri',onclick:pkSaveHere},'Save "'+pkPath[pkPath.length-1]+'" as is');
      PK_EL.here.append(s,h('span',{class:'tag'},'Skip the rest when you do not know the detail'));
    }
    PK_EL.hint.replaceChildren(h('span',{},h('kbd',{},'←'),h('kbd',{},'↑'),h('kbd',{},'↓'),h('kbd',{},'→'),' move'),h('span',{},h('kbd',{},'Enter'),' pick'),h('span',{},h('kbd',{},'1'),'-',h('kbd',{},'9'),' quick pick'),h('span',{},h('kbd',{},'Backspace'),' up one level'),h('span',{},h('kbd',{},'/'),' jump to anything'),h('span',{},h('kbd',{},'Esc'),' back to top'));
  }
  pkRenderTray();pkRenderStats();
  if(pkFocusTab){const t=PK_EL.tabs.querySelector('[aria-selected="true"]');if(t)t.focus();pkFocusTab=false}
  else if(pkFocusIdx!=null){const b=o.children[Math.min(pkFocusIdx,o.children.length-1)];if(b)b.focus({preventScroll:true})}
}
function pkStagePick(n){
  pkCtx[pkStage]=n.n==='Skip'?null:n.n;
  pkLogEv({t:'ctx',stage:pkStage,value:pkCtx[pkStage]});
  if(pkStage==='mode'){pkCtx.source=null;pkStage='source'}
  else if(pkStage==='source')pkStage='age';
  else pkStage='pick';
  pkFocusIdx=0;
  if(section==='add')pkRender();
}
function pkUp(){
  if(!pkPath.length)return;
  const left=pkPath[pkPath.length-1];pkPath=pkPath.slice(0,-1);pkShowAll=true;
  const ord=pkOrder(pkNode(),pkDom,pkPath.join('>'));pkFocusIdx=Math.max(0,ord.findIndex(x=>x.n===left));pkRender();
}
function pkPickEvent(parentPath,label,rank,size,leaf,via){
  pkLogEv({t:'pick',ctx:{...pkCtx},domain:pkDom,parent:parentPath.join('>'),pick:label,rank,size,leaf,via});
}
function pkChoose(n,ord){
  const rank=ord.findIndex(x=>x.n===n.n);
  pkPickEvent(pkPath,n.n,rank,ord.length,!n.k,'list');
  const p=pkPath.concat(n.n);
  if(n.k){pkPath=p;pkShowAll=false;pkFocusIdx=0;pkRender();return}
  pkFocusIdx=rank;pkToggle(pkDom,p);
  if(!PK_TREE[pkDom].multi){pkPath=[];pkFocusIdx=0}
  pkRender();
}
function pkSaveHere(){
  pkPickEvent(pkPath.slice(0,-1),pkPath[pkPath.length-1],null,null,false,'save');
  if(!pkHas(pkDom,pkPath))pkToggle(pkDom,pkPath);
  pkFocusIdx=0;if(!PK_TREE[pkDom].multi)pkPath=[];pkRender();
}
function pkDetailsObj(){const out={};pkSel.forEach(s=>{(out[s.dom.toLowerCase()]=out[s.dom.toLowerCase()]||[]).push(s.path)});return out}
function pkRenderTray(){
  if(!PK_EL)return;
  const t=PK_EL.tray;t.textContent='';
  PK_EL.cnt.textContent=pkSel.length+(pkSel.length===1?' detail':' details');
  if(!pkSel.length)t.append(h('div',{class:'hold'},'Nothing saved yet.'));
  pkSel.forEach(s=>{
    t.append(h('span',{class:'pk-selchip',style:'--c:'+PK_TREE[s.dom].c},h('b',{},s.dom),s.path.join(' › '),
      h('button',{'aria-label':'Remove '+s.path.join(' '),onclick:()=>{pkToggle(s.dom,s.path);pkRender()}},'×')));
  });
  PK_EL.json.textContent=JSON.stringify({name:pkName||null,context:pkCtx,...pkDetailsObj()},null,2);
}
function pkRenderStats(){
  if(!PK_EL)return;
  const picks=PK_LOG.filter(e=>e.t==='pick'&&e.rank!=null);
  const hit=picks.length?Math.round(100*picks.filter(e=>e.rank<3).length/picks.length):null;
  const avg=picks.length?(picks.reduce((a,e)=>a+e.rank,0)/picks.length+1).toFixed(1):null;
  const first=picks.length?Math.round(100*picks.filter(e=>e.rank===0).length/picks.length):null;
  const s=PK_EL.stats;s.textContent='';
  [[PK_PEOPLE.length,'People saved'],[picks.length,'Picks logged'],[hit==null?'n/a':hit+'%','In top 3'],[first==null?'n/a':first+'%','Was first option'],[avg==null?'n/a':avg,'Average position']].forEach(([v,l])=>{
    s.append(h('div',{class:'pk-stat'},h('b',{},v),h('span',{},l)));
  });
  const byDom={};PK_LOG.filter(e=>e.t==='pick').forEach(e=>byDom[e.domain]=(byDom[e.domain]||0)+1);
  const dSvg=document.getElementById('pkchart-dom');if(dSvg){dSvg.textContent='';barChart(dSvg,Object.entries(byDom).sort((a,b)=>b[1]-a[1]),'#a595f3')}
  const byPick={};PK_LOG.filter(e=>e.t==='pick').forEach(e=>byPick[e.pick]=(byPick[e.pick]||0)+1);
  const tSvg=document.getElementById('pkchart-top');if(tSvg){tSvg.textContent='';barChart(tSvg,Object.entries(byPick).sort((a,b)=>b[1]-a[1]).slice(0,7),'#f291b4')}
}
function pkJumpInput(){
  const q=PK_EL.q,res=PK_EL.res;
  const t=q.value.trim().toLowerCase();res.textContent='';
  if(!t){res.hidden=true;return}
  const hits=PK_INDEX.filter(x=>(!PK_TREE[x.dom].only||PK_TREE[x.dom].only===pkCtx.mode)&&x.path.join(' ').toLowerCase().includes(t)).sort((a,b)=>a.path.length-b.path.length).slice(0,7);
  res.hidden=false;
  if(!hits.length){res.append(h('button',{},'No match'));return}
  hits.forEach(hit=>{
    res.append(h('button',{onclick:()=>{
      pkDom=hit.dom;
      if(hit.leaf){const full=hit.path;pkPickEvent(full.slice(0,-1),full[full.length-1],null,null,true,'jump');if(!pkHas(pkDom,full))pkToggle(pkDom,full);pkPath=PK_TREE[pkDom].multi?full.slice(0,-1):[]}
      else pkPath=hit.path;
      pkShowAll=true;pkFocusIdx=0;q.value='';res.hidden=true;pkRender();
    }},hit.path.join(' › '),h('small',{},hit.dom)));
  });
}
function pkSavePerson(stay){
  const name=(pkName||'').trim();
  if(!name){const n=document.getElementById('pkname');if(n)n.focus();msg='Give them a name first.';const bar=h('div',{class:'card swap-in',style:'padding:12px 16px'},msg);msg='';viewEl.prepend(bar);setTimeout(()=>bar.remove(),3000);return}
  const details=pkDetailsObj();
  const ONLINE_SRC=['Instagram','TikTok','Discord','Snapchat','Reddit','X or Twitter'];
  let p=pkEditing?data.people.find(x=>x.id===pkEditing):null;
  if(!p){p=newPerson(name);data.people.push(p)}
  p.name=name;
  if(pkCtx.mode)p.mode=pkCtx.mode==='Online'?'online':'in-person';
  if(pkCtx.source){
    if(pkCtx.mode==='Online'){if(ONLINE_SRC.includes(pkCtx.source))p.platform=pkCtx.source;else if(!p.where)p.where=pkCtx.source}
    else p.where=pkCtx.source;
  }
  if(pkCtx.age)p.ageBracket=pkCtx.age;
  p.details=details;
  if(pkMeta&&pkMeta.snap){
    const[user,,date,li,si]=pkMeta.snap;
    p.handle=user;p.platform='Snapchat';p.mode='online';p.onlineDate=date||'';p.met=date||p.met;p.lastContact='';if(!p.where)p.where='Snapchat';
    p.notes='From My Data Export (Snapchat) · '+SNAP.lists[li]+(SNAP.sources[si]?' · added by '+SNAP.sources[si]:'');
  }
  p.updated=Date.now();save();
  const rec={id:p.id,name:p.name,context:{...pkCtx},details,saved:Date.now()};
  const ri=PK_PEOPLE.findIndex(x=>x.id===p.id);if(ri>=0)PK_PEOPLE[ri]=rec;else PK_PEOPLE.push(rec);
  pkSavePeople();
  pkLogEv({t:'person',id:p.id,count:pkSel.length,ctx:{...pkCtx}});
  const savedName=p.name;
  if(stay){pkResetIntake();pkRender();const n=document.getElementById('pkname');if(n)n.focus();msg='Saved '+savedName+'.';const bar=h('div',{class:'card swap-in',style:'padding:12px 16px'},msg);msg='';viewEl.prepend(bar);setTimeout(()=>bar.remove(),3500)}
  else{pkResetIntake();selectPerson(p.id)}
}
document.addEventListener('keydown',e=>{
  if(section!=='add'||ovl||!PK_EL)return;
  const a=document.activeElement;
  if(a===PK_EL.q||(a&&a.id==='pkname'))return;
  if(e.key==='/'&&pkStage==='pick'){e.preventDefault();PK_EL.q.focus();return}
  if(e.key==='Backspace'){e.preventDefault();if(pkStage==='pick')pkUp();else if(pkStage!=='mode'){pkStage=pkStage==='age'?'source':'mode';pkFocusIdx=0;pkRender()}return}
  if(e.key==='Escape'&&pkStage==='pick'){pkPath=[];pkShowAll=false;pkFocusIdx=0;pkRender();return}
  if(/^[1-9]$/.test(e.key)){
    const list=pkStage!=='pick'?pkStageList():(pkShowAll?pkOrder(pkNode(),pkDom,pkPath.join('>')):pkOrder(pkNode(),pkDom,pkPath.join('>')).slice(0,PK_LIMIT));
    const n=list[Number(e.key)-1];if(!n)return;
    if(pkStage!=='pick')pkStagePick(n);else pkChoose(n,pkOrder(pkNode(),pkDom,pkPath.join('>')));
  }
});

/* keyboard */
document.addEventListener('keydown',e=>{
  const ae=document.activeElement;
  const typing=ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&ae.id!=='railFilter';
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();ovl?closeOvl():openPalette();return}
  if((e.ctrlKey||e.metaKey)&&e.key==='.'){e.preventDefault();if(section==='people')focusCapture();return}
  if(e.key==='Escape'){
    if(ovl){closeOvl();return}
    if(ctxOpen){ctxOpen=false;const c=document.querySelector('.ctxcol');if(c)c.classList.remove('open');return}
    if(ae&&ae.id==='capIn'){ae.blur();return}
    return;
  }
  if(ovl||section!=='people')return;
  if(e.key==='?'&&!typing){e.preventDefault();openHelp();return}
  if(typing)return;
  if(e.key==='/'&&ae.id!=='railFilter'){e.preventDefault();const f=document.getElementById('railFilter');if(f){showPane('people');f.focus()}return}
  if((e.key==='n'||e.key==='N')){e.preventDefault();startIntakeNew();return}
  if((e.key==='r'||e.key==='R')&&person()){e.preventDefault();focusCapture();return}
  if((e.key==='c'||e.key==='C')&&window.innerWidth<=1180&&window.innerWidth>900){ctxOpen=!ctxOpen;const c=document.querySelector('.ctxcol');if(c)c.classList.toggle('open',ctxOpen);return}
  if(e.key==='ArrowDown'||e.key==='ArrowUp'||e.key==='j'||e.key==='k'){
    const list=railList();if(!list.length)return;
    e.preventDefault();
    railCursor=Math.min(list.length-1,Math.max(0,railCursor+((e.key==='ArrowDown'||e.key==='j')?1:-1)));
    const it=listEl.querySelectorAll('.pitem')[railCursor];if(it){it.scrollIntoView({block:'nearest'});listEl.querySelectorAll('.pitem').forEach(x=>x.style.borderColor='');it.style.borderColor='rgba(109,184,238,.6)'}
    return;
  }
  if(e.key==='Enter'&&ae.id!=='railNew'){
    const list=railList();const p=list[railCursor];if(p&&(ae===document.body||ae.classList.contains('pitem')))selectPerson(p.id);
  }
});
load();renderAll();
